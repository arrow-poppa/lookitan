name: build

on:
  push:
    branches: [main, tests]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # 24.04: xcap's PipeWire bindings need PipeWire >= 1.0 headers (22.04 ships 0.3.48).
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libegl-dev libgbm-dev libclang-dev libudev-dev pkg-config libfuse2t64 file

      - name: Cache OCR models, ONNX Runtime and Hunspell dictionaries
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/models
            src-tauri/resources/ort
            src-tauri/resources/hunspell
          key: assets-${{ matrix.platform }}-${{ hashFiles('scripts/fetch-assets.py') }}

      - name: Fetch OCR models, ONNX Runtime and Hunspell dictionaries
        run: |
          python -m pip install --quiet pyyaml
          python scripts/fetch-assets.py --platform ${{ matrix.platform }}

      - name: Install front-end dependencies
        run: npm ci

      - name: Test UI startup
        run: npm test

      - name: Generate icons
        run: npx tauri icon app-icon.svg

      - name: Test OCR recovery
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # PP-OCRv5 Cyrillic and the experimental PP-OCRv6 Tiny RU on a Russian fixture, with the
      # fetched models and ONNX Runtime; on Windows the GPU is also asked for and falls back to the CPU.
      - name: Test the Russian recognizers with the real models
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib ocr::paddle::tests::real_russian_recognizers -- --ignored --nocapture

      # MeikiOCR's recognizers are not in the installers (the app downloads them when the user
      # picks it): fetched here as the app does, pinned in ocr/models.rs, for their real test.
      - name: Cache MeikiOCR models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/meiki
          key: meiki-${{ hashFiles('src-tauri/src/ocr/models.rs') }}

      - name: Test MeikiOCR with the real models
        shell: bash
        env:
          LOOKITAN_MEIKI: ${{ runner.temp }}/meiki
        run: |
          python scripts/fetch-ocr-models.py MEIKI "$LOOKITAN_MEIKI"
          cargo test --manifest-path src-tauri/Cargo.toml --lib ocr::meiki::tests::real_meiki -- --ignored --nocapture

      # IndraOCR's detector and recognizers are downloaded by the app only after the user accepts
      # their licence: fetched here, pinned in ocr/models.rs, for their real tests.
      - name: Cache IndraOCR models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/indra
          key: indra-${{ hashFiles('src-tauri/src/ocr/models.rs') }}

      - name: Test IndraOCR with the real models
        shell: bash
        env:
          LOOKITAN_INDRA: ${{ runner.temp }}/indra
        run: |
          python scripts/fetch-ocr-models.py INDRA "$LOOKITAN_INDRA"
          cargo test --manifest-path src-tauri/Cargo.toml --lib ocr::indra::tests::real_indra -- --ignored --nocapture

      # Chrome ScreenAI is not in the installers either (the app downloads it when the user picks
      # it): CIPD's latest instance, fetched as the app does, for its real test.
      - name: Resolve Chrome ScreenAI
        id: screenai
        shell: bash
        run: echo "digest=$(python scripts/fetch-ocr-models.py SCREENAI-DIGEST:${{ matrix.platform }} -)" >> "$GITHUB_OUTPUT"

      - name: Cache Chrome ScreenAI
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/screenai
          key: screenai-${{ matrix.platform }}-${{ steps.screenai.outputs.digest }}

      - name: Test Chrome ScreenAI with the real library
        shell: bash
        env:
          LOOKITAN_SCREENAI: ${{ runner.temp }}/screenai/resources
        run: |
          python scripts/fetch-ocr-models.py SCREENAI:${{ matrix.platform }} "${{ runner.temp }}/screenai"
          cargo test --manifest-path src-tauri/Cargo.toml --lib ocr::screenai::tests::real_screenai -- --ignored --nocapture

      # OneOCR's files are Microsoft's and not in the installers: read out of the Snipping Tool's
      # package on Microsoft's servers as the app does without a Snipping Tool (ocr/store.rs),
      # checked against the package's signature, for its real test. Windows only. The link comes
      # from a third-party site, so a failure here does not fail the build.
      - name: Cache OneOCR
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oneocr
          key: oneocr-${{ hashFiles('src-tauri/src/ocr/store.rs') }}

      - name: Test OneOCR with the real files
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: bash
        env:
          LOOKITAN_ONEOCR: ${{ runner.temp }}/oneocr
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib ocr::store::tests::real_store -- --ignored --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --lib ocr::oneocr::tests::real_oneocr -- --ignored --nocapture

      # The word analyzers' dictionaries (segment/mod.rs PACKS), as the app downloads them.
      - name: Cache word analyzer dictionaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/segmenters
          key: segmenters-${{ matrix.platform }}-${{ hashFiles('src-tauri/src/segment/mod.rs') }}

      - name: Test word analysis with the real dictionaries
        env:
          LOOKITAN_SEGMENTERS: ${{ runner.temp }}/segmenters
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib segment::tests::real_dictionaries -- --ignored --nocapture

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google Lens's key when the user has none (ocr/lens.rs); empty for a fork's pull request.
          LOOKITAN_LENS_API_KEY: ${{ secrets.LOOKITAN_LENS_API_KEY }}
          # linuxdeploy's bundled strip cannot read the .relr.dyn sections of Ubuntu 24.04 binaries.
          NO_STRIP: "true"
          # Run linuxdeploy without mounting it through FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Lookitan {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --verbose

      - name: Verify RPM screen capture authorization
        if: matrix.platform == 'linux'
        run: python scripts/check-linux-rpm.py

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lookitan-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
