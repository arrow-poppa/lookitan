name: build

on:
  push:
    branches: [main, tests]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # 24.04: xcap's PipeWire bindings need PipeWire >= 1.0 headers (22.04 ships 0.3.48).
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libegl-dev libgbm-dev libclang-dev libudev-dev pkg-config libfuse2t64 file

      - name: Cache OCR models, ONNX Runtime and Hunspell dictionaries
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/models
            src-tauri/resources/ort
            src-tauri/resources/hunspell
          key: assets-${{ matrix.platform }}-${{ hashFiles('scripts/fetch-assets.py') }}

      - name: Fetch OCR models, ONNX Runtime and Hunspell dictionaries
        run: |
          python -m pip install --quiet pyyaml
          python scripts/fetch-assets.py --platform ${{ matrix.platform }}

      - name: Install front-end dependencies
        run: npm ci

      - name: Test UI startup
        run: npm test

      - name: Generate icons
        run: npx tauri icon app-icon.svg

      - name: Test OCR recovery
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # The word analyzers' dictionaries (segment/mod.rs PACKS), as the app downloads them.
      - name: Cache word analyzer dictionaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/segmenters
          key: segmenters-${{ matrix.platform }}-${{ hashFiles('src-tauri/src/segment/mod.rs') }}

      - name: Test word analysis with the real dictionaries
        env:
          LOOKITAN_SEGMENTERS: ${{ runner.temp }}/segmenters
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib segment::tests::real_dictionaries -- --ignored --nocapture

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google Lens's key when the user has none (ocr/lens.rs); empty for a fork's pull request.
          LOOKITAN_LENS_API_KEY: ${{ secrets.LOOKITAN_LENS_API_KEY }}
          # linuxdeploy's bundled strip cannot read the .relr.dyn sections of Ubuntu 24.04 binaries.
          NO_STRIP: "true"
          # Run linuxdeploy without mounting it through FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Lookitan {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: --verbose

      - name: Verify RPM screen capture authorization
        if: matrix.platform == 'linux'
        run: python scripts/check-linux-rpm.py

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lookitan-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
