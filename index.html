<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lookitan</title>
    <link rel="stylesheet" href="/src/shared.css">
    <link rel="stylesheet" href="/src/main/main.css">
</head>
<body>
    <header class="topbar">
        <img class="logo" src="/app-icon.svg" alt="">
        <nav class="tabs">
            <button data-tab="words">Palavras</button>
            <button data-tab="dicts">Dicionários</button>
            <button data-tab="settings">Configurações</button>
        </nav>
        <span class="save-state" id="save-state"></span>
    </header>

    <!-- Palavras -->
    <section class="tab" id="tab-words" hidden>
        <div class="toolbar">
            <input id="words-search" type="text" placeholder="Pesquisar palavras, traduções, contexto…">
            <select id="words-sort">
                <option value="newest">Mais recentes primeiro</option>
                <option value="oldest">Mais antigas primeiro</option>
                <option value="az">A–Z</option>
            </select>
            <span class="spacer"></span>
            <button id="anki-sync"><i data-icon="sync"></i>Sincronizar com o Anki</button>
            <button id="words-export"><i data-icon="export"></i>Exportar</button>
        </div>
        <div class="split panel">
            <div class="pane list-pane" id="words-list"></div>
            <div class="pane detail-pane" id="words-detail"></div>
        </div>
    </section>

    <!-- Dicionários -->
    <section class="tab" id="tab-dicts" hidden>
        <div class="split panel dicts">
            <div class="pane list-pane">
                <button id="add-dict"><i data-icon="plus"></i>Adicionar dicionário</button>
                <div class="caption">Ordem no popup</div>
                <ol id="dict-list" class="dict-list"></ol>
            </div>
            <div class="pane detail-pane scroll" id="dict-detail"></div>
        </div>
    </section>

    <!-- Configurações -->
    <section class="tab scroll" id="tab-settings" hidden>
        <div class="settings-col" id="settings-col"></div>
    </section>

    <script type="module" src="/src/main/main.js"></script>
</body>
</html>
