<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lookitan</title>
    <link rel="stylesheet" href="/src/shared.css">
    <link rel="stylesheet" href="/src/popup/popup.css">
</head>
<body>
    <div class="card" id="card">
        <div class="top" data-tauri-drag-region>
            <form id="search" autocomplete="off" hidden>
                <input id="query" type="text" spellcheck="false" placeholder="Pesquisar palavra">
            </form>
            <span class="spacer" data-tauri-drag-region></span>
            <button class="ghost icon" id="btn-search" title="Pesquisar"><i data-icon="search"></i></button>
            <button class="ghost count" id="btn-anki-notes" hidden></button>
            <button class="ghost icon" id="btn-anki" title="Adicionar ao Anki" hidden><i data-icon="plus"></i></button>
            <button class="ghost count" id="btn-saved" hidden></button>
            <button class="ghost icon" id="btn-save" title="Salvar palavra"><i data-icon="bookmark"></i></button>
            <button class="ghost icon" id="btn-pin" title="Fixar"><i data-icon="pin"></i></button>
            <button class="ghost icon" id="btn-close" title="Fechar (Esc)"><i data-icon="close"></i></button>
        </div>
        <div id="notice" class="notice" hidden></div>
        <div id="anki-status" class="notice" role="status" hidden></div>
        <main id="sections"></main>
        <footer id="meta" class="meta"></footer>
    </div>
    <script type="module" src="/src/popup/main.js"></script>
</body>
</html>
