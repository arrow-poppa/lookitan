[package]
name = "lookitan-dictionary-tests"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.23"
bzip2 = "0.6"
encoding_rs = "0.8"
flate2 = "1"
hunspell-rs = "0.4"
# hunspell-rs turns off hunspell-sys's default features, so its bindgen would not load libclang
# itself; with another bindgen user (pipewire on Linux) clang-sys is in runtime mode and panics.
# hunspell-sys's defaults make its bindgen load libclang at run time too.
hunspell-sys = { version = "0.3", features = ["bundled"] }
log = "0.4"
lzma-rs = "0.3"
lzokay = "2.0"
memmap2 = "0.9"
parking_lot = "0.12"
quick-xml = "0.38"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
# Archives Lookupper imports besides ZIP (archive.rs): pure Rust, Apache/MIT licensed.
rars = { version = "0.10", default-features = false }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["ppmd"] }
tar = "0.4"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }

[dev-dependencies]
# Tests write the archives they unpack: RAR4/RAR5 volume sets, 7z and xz.
rars = { version = "0.10", default-features = false, features = ["write"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["ppmd", "compress", "util"] }
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }
