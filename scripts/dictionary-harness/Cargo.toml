[package]
name = "lookitan-dictionary-tests"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.23"
bzip2 = "0.6"
encoding_rs = "0.8"
flate2 = "1"
hunspell-rs = "0.4"
log = "0.4"
lzma-rs = "0.3"
lzokay = "2.0"
memmap2 = "0.9"
parking_lot = "0.12"
quick-xml = "0.38"
ripemd = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
