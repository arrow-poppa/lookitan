<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Lookitan Overlay</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; cursor: default; }
        #frame { position: fixed; left: 0; top: 0; object-fit: fill; display: none; }
        #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.01); transition: background 160ms; }
        /* Clickable words, as in Lookupper: invisible until used. The word under the pointer and
           the words already looked up get a faint yellow; the word being looked up a strong one.
           .w is the clickable area, wider than the word; .ink inside it is the word's drawn box. */
        .w { position: fixed; background: transparent; cursor: pointer; }
        .w > .ink { position: absolute; border-radius: 2px; pointer-events: none; transition: background 60ms; }
        .w:hover > .ink, .w.seen > .ink { background: rgba(255, 221, 0, 0.26); }
        .w.sel > .ink, .w.sel:hover > .ink { background: rgba(255, 221, 0, 0.5); }
        #hint.spotlight { display: none; }
        /* Between lookups, and while a whole-screen lookup is still being read: nothing visible.
           The near-transparent shade stays, so the window still takes the clicks and the wheel. */
        body.idle #frame, body.idle #dim, body.idle #block, body.idle #words, body.idle #hint { visibility: hidden; }
        /* The block of text the shortcut was pressed on, off its words (automatic capture). */
        #block {
            position: fixed; display: none; pointer-events: none; border-radius: 8px;
            background: rgba(255, 255, 255, 0.07); box-shadow: 0 0 0 1px rgba(255, 221, 0, 0.6);
        }

        /* Whole-screen lookup: the captured frame, slightly blurred, with each word drawn as a sharp
           cut-out of it so the words stand out. The yellow highlights sit on top of the cut-out. */
        #frame.spotlight { filter: blur(2.5px) brightness(0.85); }
        /* Live screen (no freeze): the same slight dim, with holes where the words are. */
        #dim { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; display: none; }
        #words.spotlight .w > .ink, #words.spotlight .w:hover > .ink, #words.spotlight .w.seen > .ink, #words.spotlight .w.sel > .ink {
            background-color: transparent;
            background-repeat: no-repeat;
        }
        #words.spotlight .ink::after { content: ""; position: absolute; inset: 0; border-radius: inherit; transition: background 60ms; }
        #words.spotlight .w:hover > .ink::after, #words.spotlight .w.seen > .ink::after { background: rgba(255, 221, 0, 0.26); }
        #words.spotlight .w.sel > .ink::after { background: rgba(255, 221, 0, 0.5); }
        #hint {
            position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
            font: 12.5px system-ui, "Segoe UI", sans-serif; color: #fff;
            background: rgba(20, 22, 26, 0.78); padding: 6px 12px; border-radius: 999px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <img id="frame" alt="">
    <div id="shade"></div>
    <canvas id="dim"></canvas>
    <div id="block"></div>
    <div id="words"></div>
    <div id="hint">Clique em outra palavra · Esc para fechar</div>
    <script type="module" src="/src/overlay/main.js"></script>
</body>
</html>
