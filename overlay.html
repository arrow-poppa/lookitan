<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Lookitan Overlay</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; cursor: default; }
        #frame { position: fixed; left: 0; top: 0; object-fit: fill; display: none; }
        #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.01); transition: background 160ms; }
        /* Clickable words, as in Lookupper: invisible until used. The word under the pointer and
           the words already looked up get a faint yellow; the word being looked up a strong one. */
        .w {
            position: fixed;
            border-radius: 2px;
            background: transparent;
            cursor: pointer;
            transition: background 60ms;
        }
        .w:hover, .w.seen { background: rgba(255, 221, 0, 0.26); }
        .w.sel, .w.sel:hover { background: rgba(255, 221, 0, 0.62); }
        #hint.spotlight { display: none; }

        /* Whole-screen lookup: the captured frame, slightly blurred, with each word drawn as a sharp
           cut-out of it so the words stand out. The yellow highlights sit on top of the cut-out. */
        #frame.spotlight { filter: blur(2.5px) brightness(0.85); }
        #words.spotlight .w, #words.spotlight .w:hover, #words.spotlight .w.seen, #words.spotlight .w.sel {
            background-color: transparent;
            background-repeat: no-repeat;
        }
        #words.spotlight .w::after { content: ""; position: absolute; inset: 0; border-radius: inherit; transition: background 60ms; }
        #words.spotlight .w:hover::after, #words.spotlight .w.seen::after { background: rgba(255, 221, 0, 0.26); }
        #words.spotlight .w.sel::after { background: rgba(255, 221, 0, 0.62); }
        #hint {
            position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
            font: 12.5px system-ui, "Segoe UI", sans-serif; color: #fff;
            background: rgba(20, 22, 26, 0.78); padding: 6px 12px; border-radius: 999px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <img id="frame" alt="">
    <div id="shade"></div>
    <div id="words"></div>
    <div id="hint">Clique em outra palavra · Esc para fechar</div>
    <script type="module" src="/src/overlay/main.js"></script>
</body>
</html>
