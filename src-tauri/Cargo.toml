[package]
name = "lookitan"
version = "0.2.0"
description = "OCR pop-up dictionary for Windows and Linux with bring-your-own-key AI"
authors = ["arrow-poppa"]
license = "GPL-3.0-only"
repository = "https://github.com/arrow-poppa/lookitan"
edition = "2021"
rust-version = "1.90"

[lib]
name = "lookitan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-http = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
xcap = "0.9.8"
memmap2 = "0.9"
flate2 = "1"
encoding_rs = "0.8"
ripemd = "0.1"
lzokay = "2.0"
unicode-normalization = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
# Archives Lookupper imports besides ZIP (archive.rs): pure Rust, Apache/MIT licensed.
rars = { version = "0.10", default-features = false }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["ppmd"] }
tar = "0.4"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }
quick-xml = "0.38"
bzip2 = "0.6"
lzma-rs = "0.3"
regex = "1"
# Yomitan's Arabic rules use lookbehind and lookahead, which `regex` does not have.
fancy-regex = "0.13"
# Game controllers (gamepad.rs): XInput on Windows, which reads while another window has the
# focus as Lookupper's does (the default WGI backend would not), and evdev on Linux.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
hunspell-rs = "0.4"
# hunspell-rs turns off hunspell-sys's default features, so its bindgen would not load libclang
# itself; with another bindgen user (pipewire on Linux) clang-sys is in runtime mode and panics.
# hunspell-sys's defaults make its bindgen load libclang at run time too.
hunspell-sys = { version = "0.3", features = ["bundled"] }
prost = "0.14"
# Local word audio databases (audio.rs): local-audio-yomichan's entries.db / android.db, read-only.
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "gzip"] }
# Edge's neural voices (edge_tts.rs): a websocket with the Edge client's headers, which a WebView
# cannot set, and the Sec-MS-GEC hash. rustls here uses reqwest's ring provider.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
sha2 = "0.10"
# OneOCR's model file (ocr/onemodel.rs) is AES-256-CBC: RustCrypto's, as sha2 is.
aes = "0.8"
cbc = "0.1"
# Korean words where Kiwi has no build (segment/): lindera (MIT) reads the prebuilt ko-dic of its
# GitHub release, downloaded on first use and memory-mapped.
lindera = "=6.2.0"
# Chinese words (segment/chinese.rs): jieba's algorithm and HMM tables (MIT), over the dictionary
# Lookupper uses, downloaded on first use.
jieba-rs = { version = "=0.11.0", default-features = false }
# Japanese words (segment/sudachidict.rs): Sudachi (Apache-2.0) with its default plugins, as
# Lookupper runs it. Not on crates.io; 0.7 reads only the newer dictionary format, and Lookupper's
# SudachiDict (core 20260723) is the older one.
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", tag = "v0.6.11" }
# Korean words (segment/kiwi.rs): Kiwi's C library, downloaded on first use and loaded at run time.
libloading = "0.8"

[dev-dependencies]
# Tests write the archives they unpack: RAR4/RAR5 volume sets, 7z and xz.
rars = { version = "0.10", default-features = false, features = ["write"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["ppmd", "compress", "util"] }
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }

[target.'cfg(windows)'.dependencies]
# Whether the video card is dedicated (ocr/gpu_kind.rs): Direct3D 12 asked whether DirectML's adapter is
# UMA. The same version Tauri's WebView2 already builds. Also where the Snipping Tool is installed
# (ocr/oneocr.rs) and its package signature checked (ocr/store.rs), by Windows itself, not PowerShell.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security_Cryptography", "Win32_Storage_Packaging_Appx"] }
# PlayStation pads' HID reports (gamepad/playstation.rs), which XInput does not see.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
ort ={ version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24", "directml"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.17"
# Whether the video card is dedicated (ocr/gpu_kind.rs): Vulkan's device types, the loader opened at run
# time (no link to libvulkan).
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
# glibc's mallopt and malloc_trim, so freed memory goes back to the system (platform/memory.rs).
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
